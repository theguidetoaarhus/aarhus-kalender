name: Opdatér Aarhus-kalenderen

on:
  schedule:
    # Hver nat kl. 04:00 dansk tid (02:00/03:00 UTC afhængig af sommertid - vi bruger 03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # giver mulighed for at trykke "Run workflow" manuelt på GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent events og byg kalenderfiler
        run: python3 scrape_aarhus_events.py --days 180

      - name: Commit og push ændringer
        run: |
          git config user.name "aarhus-kalender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.ics' events.json
          git diff --cached --quiet || git commit -m "Opdater events ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
